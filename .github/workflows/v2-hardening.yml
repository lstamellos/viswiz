name: Materialize VisWiz v2 hardening

on:
  push:
    branches:
      - refactor/v2-architecture

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Materialize verified hardening patch
        shell: bash
        run: |
          set -euo pipefail

          cat \
            .github/v2-hardening.part00_0 \
            .github/v2-hardening.part00_1 \
            .github/v2-hardening.part01 \
            .github/v2-hardening.part02_0 \
            .github/v2-hardening.part02_1 \
            .github/v2-hardening.part03 \
            .github/v2-hardening.part04 \
            .github/v2-hardening.part05 \
            .github/v2-hardening.part06 \
            > /tmp/v2-hardening.b64

          echo '201aee084ee403c8193440a5d6750bc67a27d4d092e15ebdd765307ca3b0d0df  /tmp/v2-hardening.b64' | sha256sum --check --strict
          base64 --decode /tmp/v2-hardening.b64 > /tmp/v2-hardening.tar.gz
          echo '5e45fa16bb92a585bc305438caa3e4209c29ef700b6fa921662aed0f3fdfc1ba  /tmp/v2-hardening.tar.gz' | sha256sum --check --strict

          rm -rf /tmp/v2-hardening
          mkdir -p /tmp/v2-hardening
          tar -xzf /tmp/v2-hardening.tar.gz -C /tmp/v2-hardening

          test -f /tmp/v2-hardening/src/Database/DatasetRepository.php
          test -f /tmp/v2-hardening/src/Database/Migrator.php
          test -f /tmp/v2-hardening/src/Frontend/Frontend.php
          test -f /tmp/v2-hardening/tests/wp-smoke.php

          rsync -a /tmp/v2-hardening/ ./
          rm -f .github/v2-hardening.part*

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Harden VisWiz 2.0 migration and graph workflows'
          git push origin HEAD:${GITHUB_REF_NAME}
