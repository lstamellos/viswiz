name: Localization diagnostic

on:
  push:
    branches:
      - feature/javascript-localization

permissions:
  contents: write

jobs:
  phpunit-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Capture PHPUnit output
        shell: bash
        run: |
          set +e
          composer test > phpunit-output.txt 2>&1
          status=$?
          set -e
          printf '\nEXIT_STATUS=%s\n' "$status" >> phpunit-output.txt

      - name: Commit diagnostic output and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/localization-diagnostic.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/localization-diagnostic.yml phpunit-output.txt
          git commit -m '[skip ci] Capture localization PHPUnit diagnostic'
          git push origin HEAD:feature/javascript-localization
