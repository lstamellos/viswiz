name: Localization contract fix

on:
  push:
    branches:
      - feature/javascript-localization

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Apply audited test-contract updates
        run: python tools/localization_test_contract_fix.py

      - name: Run unit and architecture tests
        shell: bash
        run: |
          set +e
          composer test > localization-contract-test-output.txt 2>&1
          status=$?
          set -e
          printf '\nEXIT_STATUS=%s\n' "$status" >> localization-contract-test-output.txt
          echo "TEST_STATUS=$status" >> "$GITHUB_ENV"

      - name: Commit result and remove temporary diagnostics
        shell: bash
        run: |
          rm -f .github/workflows/localization-contract-fix.yml
          rm -f tools/localization_test_contract_fix.py
          rm -f phpunit-output.txt
          if [ "${TEST_STATUS}" = "0" ]; then
            rm -f localization-contract-test-output.txt
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if [ "${TEST_STATUS}" = "0" ]; then
            git commit -m 'Align regression tests with WordPress JavaScript i18n'
          else
            git commit -m '[skip ci] Capture localization contract test result'
          fi
          git push origin HEAD:feature/javascript-localization

      - name: Fail if tests remain red
        if: env.TEST_STATUS != '0'
        run: exit 1
