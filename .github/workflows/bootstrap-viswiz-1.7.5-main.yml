name: Bootstrap VisWiz 1.7.5 on main

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch plugin and install release workflow
        shell: bash
        run: |
          set -euo pipefail
          test -f includes/viswiz-updater.php
          php -l includes/viswiz-updater.php

          python3 - <<'PY'
          from pathlib import Path
          p = Path('viswiz.php')
          s = p.read_text()
          if " * Version: 1.7.4\n" not in s or "const VISWIZ_VERSION = '1.7.4';" not in s:
              raise SystemExit('Unexpected base version; refusing to patch')
          s = s.replace(" * Version: 1.7.4\n", " * Version: 1.7.5\n", 1)
          if ' * Update URI: https://github.com/lstamellos/viswiz\n' not in s:
              s = s.replace(
                  " * Author: cremedia.studio\n",
                  " * Author: cremedia.studio\n * Update URI: https://github.com/lstamellos/viswiz\n",
                  1,
              )
          s = s.replace("const VISWIZ_VERSION = '1.7.4';", "const VISWIZ_VERSION = '1.7.5';", 1)
          needle = "const VISWIZ_OPTION_DISPLAY_DEFAULTS = 'viswiz_display_defaults';\n"
          include = "\nrequire_once __DIR__ . '/includes/viswiz-updater.php';\n"
          if "includes/viswiz-updater.php" not in s:
              if needle not in s:
                  raise SystemExit('Updater insertion point not found')
              s = s.replace(needle, needle + include, 1)
          p.write_text(s)
          PY

          cat > .github/workflows/release.yml <<'YAML'
          name: Release VisWiz

          on:
            push:
              branches:
                - main
            workflow_dispatch:

          permissions:
            contents: write

          concurrency:
            group: viswiz-release
            cancel-in-progress: false

          jobs:
            release:
              runs-on: ubuntu-latest
              steps:
                - name: Check out repository
                  uses: actions/checkout@v4
                  with:
                    fetch-depth: 0

                - name: Validate, package and release
                  env:
                    GH_TOKEN: __GITHUB_TOKEN_EXPR__
                  shell: bash
                  run: |
                    set -euo pipefail
                    VERSION="$(sed -n "s/^const VISWIZ_VERSION = '\([^']*\)';/\1/p" viswiz.php | head -n1)"
                    HEADER_VERSION="$(sed -n 's/^ \* Version: //p' viswiz.php | head -n1)"
                    test -n "$VERSION"
                    test "$VERSION" = "$HEADER_VERSION"
                    TAG="v${VERSION}"

                    if gh release view "$TAG" >/dev/null 2>&1; then
                      echo "Release $TAG already exists; nothing to do."
                      exit 0
                    fi

                    php -l viswiz.php
                    php -l includes/viswiz-updater.php
                    node --check assets/viswiz-admin.js
                    node --check assets/viswiz-block.js
                    node --check assets/viswiz.js
                    git diff --check

                    DIST_ROOT="${RUNNER_TEMP}/viswiz-release-${VERSION}"
                    rm -rf "$DIST_ROOT"
                    mkdir -p "$DIST_ROOT/viswiz"
                    rsync -a --delete --exclude '.git' --exclude '.github' --exclude '.replit' ./ "$DIST_ROOT/viswiz/"
                    (cd "$DIST_ROOT" && zip -qr "viswiz-${VERSION}.zip" viswiz)

                    gh release create "$TAG" \
                      "$DIST_ROOT/viswiz-${VERSION}.zip#WordPress installable plugin ZIP" \
                      --repo "$GITHUB_REPOSITORY" \
                      --target "$GITHUB_SHA" \
                      --title "VisWiz ${VERSION}" \
                      --generate-notes
          YAML

          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/release.yml')
          p.write_text(p.read_text().replace('__GITHUB_TOKEN_EXPR__', '$' + '{{ github.token }}'))
          PY

          rm -f .github/workflows/bootstrap-viswiz-1.7.5-main.yml

          php -l viswiz.php
          php -l includes/viswiz-updater.php
          node --check assets/viswiz-admin.js
          node --check assets/viswiz-block.js
          node --check assets/viswiz.js
          git diff --check

      - name: Commit VisWiz 1.7.5
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Enable GitHub auto-updates; bump VisWiz to 1.7.5'
          git push origin HEAD:main

      - name: Build release ZIP
        shell: bash
        run: |
          set -euo pipefail
          DIST_ROOT="${RUNNER_TEMP}/viswiz-release-1.7.5"
          rm -rf "$DIST_ROOT"
          mkdir -p "$DIST_ROOT/viswiz"
          rsync -a --delete --exclude '.git' --exclude '.github' --exclude '.replit' ./ "$DIST_ROOT/viswiz/"
          (cd "$DIST_ROOT" && zip -qr 'viswiz-1.7.5.zip' viswiz)
          echo "VISWIZ_RELEASE_ZIP=$DIST_ROOT/viswiz-1.7.5.zip" >> "$GITHUB_ENV"

      - name: Create release v1.7.5
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view 'v1.7.5' >/dev/null 2>&1; then
            echo 'Release v1.7.5 already exists.'
            exit 0
          fi
          cat > "${RUNNER_TEMP}/viswiz-1.7.5-notes.md" <<'EOF'
          ## VisWiz 1.7.5

          - Native WordPress update discovery from GitHub Releases.
          - Automatic VisWiz updates through the standard WordPress plugin updater.
          - Safe release-asset installation using `viswiz-{version}.zip` rather than GitHub source archives.
          - Automated release packaging for future version bumps on `main`.
          - Automatic updates can be disabled with `define('VISWIZ_AUTO_UPDATES', false);` in `wp-config.php`.
          EOF
          gh release create 'v1.7.5' \
            "$VISWIZ_RELEASE_ZIP#WordPress installable plugin ZIP" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --title 'VisWiz 1.7.5' \
            --notes-file "${RUNNER_TEMP}/viswiz-1.7.5-notes.md"
