name: Release VisWiz

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: viswiz-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install test dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Validate source
        shell: bash
        run: |
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
          find assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          composer test
          git diff --check HEAD^ HEAD

      - name: Validate version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n "s/^define( 'VISWIZ_VERSION', '\\([^']*\\)' );/\\1/p" viswiz.php | head -n1)"
          HEADER_VERSION="$(sed -n 's/^ \* Version: //p' viswiz.php | head -n1)"
          test -n "$VERSION"
          test "$VERSION" = "$HEADER_VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi

          DIST_ROOT="${RUNNER_TEMP}/viswiz-release-${VERSION}"
          rm -rf "$DIST_ROOT"
          mkdir -p "$DIST_ROOT/viswiz"
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.replit' \
            --exclude 'tests' \
            --exclude 'vendor' \
            --exclude 'node_modules' \
            --exclude 'playwright-report' \
            --exclude 'test-results' \
            --exclude 'playwright.config.js' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude '.phpunit.cache' \
            --exclude 'phpunit.xml.dist' \
            --exclude 'composer.lock' \
            ./ "$DIST_ROOT/viswiz/"

          test -f "$DIST_ROOT/viswiz/viswiz.php"
          test -f "$DIST_ROOT/viswiz/src/Plugin.php"
          test -f "$DIST_ROOT/viswiz/blocks/visualization/block.json"
          (cd "$DIST_ROOT" && zip -qr "viswiz-${VERSION}.zip" viswiz)
          unzip -t "$DIST_ROOT/viswiz-${VERSION}.zip"
          sha256sum "$DIST_ROOT/viswiz-${VERSION}.zip"

          gh release create "$TAG" \
            "$DIST_ROOT/viswiz-${VERSION}.zip#WordPress installable plugin ZIP" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "VisWiz ${VERSION}" \
            --generate-notes
