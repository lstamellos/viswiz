name: Temporary localization fixups

on:
  push:
    branches:
      - feature/javascript-localization

permissions:
  contents: write

jobs:
  fixups:
    if: contains(github.event.head_commit.message, '[run localization fixups]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply audited localization fixups
        run: python tools/localization_fixups.py
      - name: Syntax and diff checks
        shell: bash
        run: |
          set -e
          php -l src/Admin/Admin.php
          php -l src/Admin/VisualizationPresets.php
          php -l src/Admin/WooSourceSelection.php
          git diff --check
      - name: Commit audited fixups
        shell: bash
        run: |
          git config user.name 'viswiz-localization-audit'
          git config user.email 'actions@users.noreply.github.com'
          git add assets src tests
          git diff --cached --check
          git commit -m 'Fix localization audit regressions'
          git push origin HEAD:feature/javascript-localization
