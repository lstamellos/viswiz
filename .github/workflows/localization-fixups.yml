name: Temporary localization fixups

on:
  push:
    branches:
      - feature/javascript-localization

permissions:
  contents: write

jobs:
  fixups:
    if: contains(github.event.head_commit.message, '[run localization fixups]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply audited localization fixups
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new))

          # Repair PHP localized-config arrays that were only partially removed.
          replace('src/Admin/Admin.php', """                'relationTypes' => Registry::relation_types(),
                    'error'    => __( 'The change could not be saved.', 'viswiz' ),
                    'saved'    => __( 'Saved.', 'viswiz' ),
                    'confirmDelete' => __( 'Delete this item?', 'viswiz' ),
                ),
            )
""", """                'relationTypes' => Registry::relation_types(),
            )
""")

          replace('src/Admin/VisualizationPresets.php', """                'presets' => self::presets(),
                    'saved'          => __( 'Display preset saved.', 'viswiz' ),
                    'applied'        => __( 'Preset applied to unsaved display settings.', 'viswiz' ),
                    'nothingApplied' => __( 'This preset has no settings supported by the current renderer.', 'viswiz' ),
                    'deleted'        => __( 'Display preset deleted.', 'viswiz' ),
                    'saving'         => __( 'Saving preset…', 'viswiz' ),
                    'deleting'       => __( 'Deleting preset…', 'viswiz' ),
                    'nameRequired'   => __( 'Enter a preset name.', 'viswiz' ),
                    'requestError'   => __( 'The display preset change could not be saved.', 'viswiz' ),
                    'confirmDelete'  => __( 'Delete this display preset?', 'viswiz' ),
                ),
            )
""", """                'presets' => self::presets(),
            )
""")

          replace('src/Admin/WooSourceSelection.php', """                'categories'      => self::selected_category_labels( $is_visualization ),
                    'categories'             => __( 'Categories', 'viswiz' ),
                    'searchProducts'         => __( 'Search products…', 'viswiz' ),
                    'searchCategories'       => __( 'Search product categories…', 'viswiz' ),
                    'liveOption'             => __( 'WooCommerce live query', 'viswiz' ),
                    'liveDescription'        => __( 'Live query: recalculates from current WooCommerce orders when requested and uses the configured cache/refresh interval. No rows are copied into a dataset.', 'viswiz' ),
                    'snapshotDescription'    => __( 'Snapshot: runs the WooCommerce query once and replaces this canonical dataset with the current results. The copied rows can then be edited independently and do not stay synchronized with WooCommerce.', 'viswiz' ),
                    'snapshotButton'         => __( 'Replace dataset with current snapshot', 'viswiz' ),
                    'woocommerceInactive'    => __( 'WooCommerce is not active. Existing WooCommerce filter values are preserved, but new live queries or snapshots cannot be run.', 'viswiz' ),
                    'manualIdsFallback'      => __( 'WooCommerce search pickers are not available for this account. Product and category IDs remain editable manually.', 'viswiz' ),
                    'snapshotPermission'     => __( 'Your account does not have permission to run WooCommerce snapshots.', 'viswiz' ),
                    'graphSnapshotDisabled'  => __( 'WooCommerce snapshots require a row-based dataset and cannot replace graph data.', 'viswiz' ),
                ),
            )
""", """                'categories'      => self::selected_category_labels( $is_visualization ),
            )
""")

          # Normalize only the dependency lines touched by this feature.
          for path in [
              'src/Admin/DatasetEditorPage.php', 'src/Admin/ImportUi.php', 'src/Admin/NodePublicFields.php',
              'src/Admin/NodeRichEditor.php', 'src/Admin/SpreadsheetEditor.php', 'src/Admin/VisualizationPreview.php',
              'src/Admin/VisualizationPresets.php', 'src/Admin/WooSourceSelection.php', 'src/Runtime/GraphRuntime.php'
          ]:
              p = Path(path)
              lines = []
              for line in p.read_text().splitlines(True):
                  if "'wp-i18n'" in line:
                      line = line.replace("array('", "array( '")
                      line = line.replace("'wp-i18n');", "'wp-i18n' );")
                  lines.append(line)
              p.write_text(''.join(lines))
          replace('src/Runtime/GraphRuntime.php', "wp_set_script_translations( 'viswiz-graph-runtime', 'viswiz', VISWIZ_DIR . 'languages' );", "wp_set_script_translations( self::SCRIPT_HANDLE, 'viswiz', VISWIZ_DIR . 'languages' );")

          # Request failure fallbacks retain HTTP status while remaining translatable.
          replace('assets/viswiz-admin.js', "const error = new Error(data?.message || __('The change could not be saved.', 'viswiz') || `HTTP ${response.status}`);", "const error = new Error(data?.message || sprintf(__('The request failed with HTTP status %d.', 'viswiz'), response.status));")
          replace('assets/viswiz-dataset-editor.js', "const error = new Error(data?.message || __('The change could not be saved.', 'viswiz') || `HTTP ${response.status}`);", "const error = new Error(data?.message || sprintf(__('The request failed with HTTP status %d.', 'viswiz'), response.status));")
          replace('assets/viswiz-spreadsheet-editor.js', "const error = new Error(data?.message || __('The change could not be saved.', 'viswiz') || `HTTP ${response.status}`);", "const error = new Error(data?.message || sprintf(__('The request failed with HTTP status %d.', 'viswiz'), response.status));")
          replace('assets/viswiz-import.js', "const error = new Error(data?.message || __('The import request failed.', 'viswiz') || `HTTP ${response.status}`);", "const error = new Error(data?.message || sprintf(__('The import request failed with HTTP status %d.', 'viswiz'), response.status));")

          # Never localize machine identifiers used to generate stable slugs.
          replace('assets/viswiz-dataset-editor.js', "const baseSlug = String(node.slug || node.title || __('node', 'viswiz')).toLowerCase().replace(/[^a-z0-9_-]+/g, '-').replace(/^-+|-+$/g, '') || __('node', 'viswiz');", "const baseSlug = String(node.slug || node.title || 'node').toLowerCase().replace(/[^a-z0-9_-]+/g, '-').replace(/^-+|-+$/g, '') || 'node';")

          # Localize relation endpoint labels and direction display while preserving enum values.
          replace('assets/viswiz-dataset-editor.js', """      state,
      'From',
      'from_node_uuid',
""", """      state,
      __('From', 'viswiz'),
      'from_node_uuid',
""")
          replace('assets/viswiz-dataset-editor.js', """      state,
      'To',
      'to_node_uuid',
""", """      state,
      __('To', 'viswiz'),
      'to_node_uuid',
""")
          marker = "  function openRelationDialog(state, relation, options = {}) {"
          p = Path('assets/viswiz-dataset-editor.js')
          text = p.read_text()
          if 'function directionLabel(value)' not in text:
              helper = """  function directionLabel(value) {
    const labels = {
      directed: __('Directed', 'viswiz'),
      bidirectional: __('Bidirectional', 'viswiz'),
      undirected: __('Undirected', 'viswiz'),
    };
    return labels[value] || value || labels.directed;
  }

"""
              if marker not in text:
                  raise SystemExit('dataset direction helper marker missing')
              p.write_text(text.replace(marker, helper + marker, 1))
          replace('assets/viswiz-dataset-editor.js', "${['directed', 'bidirectional', 'undirected'].map((direction) => `<option ${current.direction === direction ? 'selected' : ''}>${direction}</option>`).join('')}", "${['directed', 'bidirectional', 'undirected'].map((direction) => `<option value=\"${direction}\" ${current.direction === direction ? 'selected' : ''}>${directionLabel(direction)}</option>`).join('')}")

          # Legacy admin editor uses the same enum contract.
          p = Path('assets/viswiz-admin.js')
          text = p.read_text()
          marker = "  function openRelationDialog(root,state,rel){"
          if 'function directionLabel(value)' not in text:
              helper = """  function directionLabel(value){const labels={directed:__('Directed','viswiz'),bidirectional:__('Bidirectional','viswiz'),undirected:__('Undirected','viswiz')};return labels[value]||value||labels.directed;}

"""
              if marker not in text:
                  raise SystemExit('admin direction helper marker missing')
              p.write_text(text.replace(marker, helper + marker, 1))
          replace('assets/viswiz-admin.js', "${['directed','bidirectional','undirected'].map((d)=>`<option ${current.direction===d?'selected':''}>${d}</option>`).join('')}", "${['directed','bidirectional','undirected'].map((d)=>`<option value=\"${d}\" ${current.direction===d?'selected':''}>${directionLabel(d)}</option>`).join('')}")

          # Finish dynamic status strings in the legacy admin editor.
          replace('assets/viswiz-admin.js', "pager.append(previous, statusText(`Page ${pageInfo.page + 1} / ${pageInfo.maxPage + 1} · ${total} ${noun}`), next);", "pager.append(previous, statusText(sprintf(__('Page %1$d / %2$d · %3$d %4$s', 'viswiz'), pageInfo.page + 1, pageInfo.maxPage + 1, total, noun)), next);")
          replace('assets/viswiz-admin.js', "bar.append(add, statusText(`${visible.length} / ${rows.length} rows · revision ${state.revision}`));", "bar.append(add, statusText(sprintf(__('%1$d / %2$d rows · revision %3$d', 'viswiz'), visible.length, rows.length, state.revision)));")
          replace('assets/viswiz-admin.js', "bar.append(addNode, addRelation, statusText(`${visibleNodes.length}/${nodes.length} nodes · ${visibleRelations.length}/${relations.length} relations · revision ${state.revision}`));", "bar.append(addNode, addRelation, statusText(sprintf(__('%1$d/%2$d nodes · %3$d/%4$d relations · revision %5$d', 'viswiz'), visibleNodes.length, nodes.length, visibleRelations.length, relations.length, state.revision)));")
          replace('assets/viswiz-admin.js', "appendPager(root, visible.length, pageInfo, (page) => { state.pages.rows = page; renderEditor(root, state); }, 'rows');", "appendPager(root, visible.length, pageInfo, (page) => { state.pages.rows = page; renderEditor(root, state); }, __('rows', 'viswiz'));")
          replace('assets/viswiz-admin.js', "appendPager(root, visibleNodes.length, nodePage, (page) => { state.pages.nodes = page; renderEditor(root, state); }, 'nodes');", "appendPager(root, visibleNodes.length, nodePage, (page) => { state.pages.nodes = page; renderEditor(root, state); }, __('nodes', 'viswiz'));")
          replace('assets/viswiz-admin.js', "appendPager(root, visibleRelations.length, relationPage, (page) => { state.pages.relations = page; renderEditor(root, state); }, 'relations');", "appendPager(root, visibleRelations.length, relationPage, (page) => { state.pages.relations = page; renderEditor(root, state); }, __('relations', 'viswiz'));")
          replace('assets/viswiz-admin.js', "${esc(rel.direction||'directed')}", "${esc(directionLabel(rel.direction || 'directed'))}")

          # Fix gettext calls accidentally embedded in ordinary quoted literals.
          replace('assets/viswiz-import.js', "${schema === 'graph' ? '<label class=\"viswiz-field\"><span>${__('Graph data', 'viswiz')}</span><select data-viswiz-import-kind><option value=\"nodes\">${__('Nodes', 'viswiz')}</option><option value=\"relations\">${__('Relations', 'viswiz')}</option></select></label>' : ''}", "${schema === 'graph' ? `<label class=\"viswiz-field\"><span>${__('Graph data', 'viswiz')}</span><select data-viswiz-import-kind><option value=\"nodes\">${__('Nodes', 'viswiz')}</option><option value=\"relations\">${__('Relations', 'viswiz')}</option></select></label>` : ''}")
          replace('assets/viswiz-import.js', "append: '${__('Append adds records without changing existing ones.', 'viswiz')}',", "append: __('Append adds records without changing existing ones.', 'viswiz'),")
          replace('assets/viswiz-import.js', "const name = chosen === '\\t' ? 'tab' : chosen === ',' ? 'comma' : chosen === ';' ? 'semicolon' : 'pipe';", "const name = chosen === '\\t' ? __('tab', 'viswiz') : chosen === ',' ? __('comma', 'viswiz') : chosen === ';' ? __('semicolon', 'viswiz') : __('pipe', 'viswiz');")

          replace('assets/viswiz-spreadsheet-editor.js', "${sheet.conflict ? '<button type=\"button\" class=\"button\" data-grid-action=\"reload\">${__('Reload server version', 'viswiz')}</button>' : ''}", "${sheet.conflict ? `<button type=\"button\" class=\"button\" data-grid-action=\"reload\">${__('Reload server version', 'viswiz')}</button>` : ''}")
          replace('assets/viswiz-spreadsheet-editor.js', "${dirty ? '<p class=\"viswiz-grid-unsaved-note\">${__('Save or discard the pending grid changes before searching, changing pages or replacing dataset state from another control.', 'viswiz')}</p>' : ''}", "${dirty ? `<p class=\"viswiz-grid-unsaved-note\">${__('Save or discard the pending grid changes before searching, changing pages or replacing dataset state from another control.', 'viswiz')}</p>` : ''}")
          replace('assets/viswiz-spreadsheet-editor.js', "<span>${shownTotal} ${esc(editor.plural || 'rows')} · ${esc(cfg.schemas?.[sheet.schema]?.label || sheet.schema)}</span>", "<span>${shownTotal} ${esc(editor.plural || __('rows', 'viswiz'))} · ${esc(cfg.schemas?.[sheet.schema]?.label || sheet.schema)}</span>")
          replace('assets/viswiz-spreadsheet-editor.js', "${rows.length ? rows.map((row, rowIndex) => {", "${rows.length ? rows.map((row, rowIndex) => {", expected=1)
          replace('assets/viswiz-spreadsheet-editor.js', "}).join('') : `<tr class=\"viswiz-grid-empty\"><td colspan=\"${fields.length + 2}\">No ${esc(editor.plural || 'rows')} found. Add a row or paste data to begin.</td></tr>`}", "}).join('') : `<tr class=\"viswiz-grid-empty\"><td colspan=\"${fields.length + 2}\">${esc(sprintf(__('No %s found. Add a row or paste data to begin.', 'viswiz'), editor.plural || __('rows', 'viswiz')))}</td></tr>`}")

          replace('assets/viswiz-node-public-fields.js', "labelWrap.innerHTML = '<span>${__('Label', 'viswiz')}</span>';", "labelWrap.innerHTML = `<span>${__('Label', 'viswiz')}</span>`;")
          replace('assets/viswiz-node-public-fields.js', "typeWrap.innerHTML = '<span>${__('Type', 'viswiz')}</span>';", "typeWrap.innerHTML = `<span>${__('Type', 'viswiz')}</span>`;")
          replace('assets/viswiz-node-public-fields.js', "valueWrap.innerHTML = '<span>${__('Value', 'viswiz')}</span>';", "valueWrap.innerHTML = `<span>${__('Value', 'viswiz')}</span>`;")

          # Remove dead config aliases/imports and clean codemod line joins.
          replace('assets/viswiz-graph-runtime.js', "const { __, sprintf } = window.wp.i18n;", "const { __ } = window.wp.i18n;")
          replace('assets/viswiz-graph-runtime.js', "const enhancedModals = new WeakSet();  const $ =", "const enhancedModals = new WeakSet();\n  const $ =")
          replace('assets/viswiz-visualization-presets.js', "const { __, sprintf } = window.wp.i18n;", "const { __ } = window.wp.i18n;")
          replace('assets/viswiz-visualization-presets.js', "const adminCfg = window.VisWizAdminV2 || {};  const $ =", "const adminCfg = window.VisWizAdminV2 || {};\n  const $ =")
          replace('assets/viswiz-visualization-preview.js', "const { __, sprintf } = window.wp.i18n;", "const { __ } = window.wp.i18n;")
          replace('assets/viswiz-visualization-preview.js', "  const previewCfg = window.VisWizVisualizationPreview || {};  const $ = (selector, root = document) => root.querySelector(selector);\n", "  const $ = (selector, root = document) => root.querySelector(selector);\n")

          # Strengthen source-contract regression coverage for the audit findings.
          p = Path('tests/JavaScriptLocalizationTest.php')
          text = p.read_text()
          needle = """            self::assertStringNotContainsString( 'const tr = (key, fallback)', $javascript, $file );
"""
          insert = needle + """            self::assertDoesNotMatchRegularExpression( '/(?:=|:|\\?)[ \\t]*[\\\'\"][^\\r\\n]*\\$\\{__\\(/', $javascript, $file . ' must not embed gettext interpolation inside a quoted literal.' );
"""
          if needle not in text:
              raise SystemExit('localization test loop marker missing')
          text = text.replace(needle, insert, 1)
          marker = """    public function test_static_translation_maps_are_removed_from_php_config(): void {
"""
          extra = """    public function test_machine_identifiers_and_relation_enum_values_stay_stable(): void {
        $dataset = file_get_contents( $this->root . '/assets/viswiz-dataset-editor.js' );
        self::assertStringNotContainsString( \"node.slug || node.title || __('node', 'viswiz')\", $dataset );
        self::assertStringContainsString( \"value=\\\"${direction}\\\"\", $dataset );
        self::assertStringContainsString( \"__('Directed', 'viswiz')\", $dataset );
    }

"""
          if marker not in text:
              raise SystemExit('localization test method marker missing')
          text = text.replace(marker, extra + marker, 1)
          p.write_text(text)
          PY
      - name: Syntax and diff checks
        shell: bash
        run: |
          set -e
          for file in src/Admin/Admin.php src/Admin/VisualizationPresets.php src/Admin/WooSourceSelection.php; do php -l "$file"; done
          git diff --check
      - name: Commit audited fixups
        shell: bash
        run: |
          git config user.name 'viswiz-localization-audit'
          git config user.email 'actions@users.noreply.github.com'
          git add assets src tests
          git diff --cached --check
          git commit -m 'Fix localization audit regressions'
          git push origin HEAD:feature/javascript-localization
