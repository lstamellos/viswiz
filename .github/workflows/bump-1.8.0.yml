name: Bump VisWiz to 1.8.0

on:
  push:
    branches:
      - feature/admin-auto-update-settings

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/admin-auto-update-settings
          fetch-depth: 0

      - name: Update plugin version and commit
        shell: bash
        run: |
          set -euo pipefail

          TARGET="1.8.0"
          HEADER_VERSION="$(sed -n 's/^ \* Version: //p' viswiz.php | head -n1)"
          CONST_VERSION="$(sed -n "s/^const VISWIZ_VERSION = '\([^']*\)';/\1/p" viswiz.php | head -n1)"

          if [[ "$HEADER_VERSION" == "$TARGET" && "$CONST_VERSION" == "$TARGET" ]]; then
            echo "VisWiz is already ${TARGET}."
            exit 0
          fi

          sed -i "s/^ \* Version: .*/ * Version: ${TARGET}/" viswiz.php
          sed -i "s/^const VISWIZ_VERSION = '[^']*';/const VISWIZ_VERSION = '${TARGET}';/" viswiz.php

          grep -q "^ \* Version: ${TARGET}$" viswiz.php
          grep -q "^const VISWIZ_VERSION = '${TARGET}';$" viswiz.php

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viswiz.php
          git commit -m "Bump VisWiz version to ${TARGET}"
          git push origin HEAD:feature/admin-auto-update-settings
