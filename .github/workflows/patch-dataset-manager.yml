name: Integrate dataset manager

on:
  push:
    branches:
      - feature/dataset-manager-ux

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/dataset-manager-ux
          fetch-depth: 0

      - name: Integrate dataset modules and version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          updater = Path('includes/viswiz-updater.php')
          text = updater.read_text()
          commerce = "require_once __DIR__ . '/viswiz-commerce-builder.php';"
          manager = "require_once __DIR__ . '/viswiz-dataset-manager.php';"
          autosave = "require_once __DIR__ . '/viswiz-dataset-autosave-sync.php';"
          if manager not in text:
              if commerce not in text:
                  raise SystemExit('Commerce builder include anchor not found')
              text = text.replace(commerce, commerce + "\n" + manager, 1)
          if autosave not in text:
              if manager not in text:
                  raise SystemExit('Dataset manager include anchor not found')
              text = text.replace(manager, manager + "\n" + autosave, 1)
          updater.write_text(text)

          main = Path('viswiz.php')
          text = main.read_text()
          text = text.replace(' * Version: 1.8.0', ' * Version: 1.8.1', 1)
          text = text.replace("const VISWIZ_VERSION = '1.8.0';", "const VISWIZ_VERSION = '1.8.1';", 1)
          main.write_text(text)

          readme = Path('README')
          text = readme.read_text()
          heading = 'VisWiz WooCommerce Visualizer\n=============================\n\n'
          block = '''Version 1.8.1 Dataset Manager & Graph Workflow\n\n- Reworked Datasets into an inspect/manage screen with search, type filters, usage, safer actions, and editable dataset metadata.\n- Added graph dataset inspection with node/relation tables, relation-degree counts, and integrity validation for duplicate/missing node IDs and orphan endpoints.\n- Added direct Open graph editor / Edit graph actions that reuse the existing node/relation builder.\n- Dataset-backed visualizations now hydrate the builder from the canonical dataset instead of showing a stale visualization-specific copy.\n- Switching a visualization to another dataset is guarded so stale editor data cannot overwrite the newly selected dataset.\n- Added dataset duplication for safe structural revisions and synchronized dataset timestamps on visualization saves/autosaves.\n- Lightweight node type/subtype autosaves now synchronize to linked dataset graph tables.\n- Dataset deletion now clears the linked visualization post metadata as well as the dataset table link.\n\n'''
          if 'Version 1.8.1 Dataset Manager & Graph Workflow' not in text:
              if heading not in text:
                  raise SystemExit('README heading not found')
              text = text.replace(heading, heading + block, 1)
          elif 'Lightweight node type/subtype autosaves now synchronize' not in text:
              text = text.replace(
                  '- Added dataset duplication for safe structural revisions and synchronized dataset timestamps on visualization saves/autosaves.\n',
                  '- Added dataset duplication for safe structural revisions and synchronized dataset timestamps on visualization saves/autosaves.\n- Lightweight node type/subtype autosaves now synchronize to linked dataset graph tables.\n',
                  1
              )
          readme.write_text(text)
          PY

          if git diff --quiet; then
            echo 'Dataset manager integration already applied.'
            exit 0
          fi

          php -l includes/viswiz-dataset-manager.php
          php -l includes/viswiz-dataset-autosave-sync.php
          php -l includes/viswiz-updater.php
          php -l viswiz.php
          node --check assets/viswiz-dataset-manager.js
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/viswiz-updater.php viswiz.php README
          git commit -m "Integrate dataset autosave synchronization"
          git push origin HEAD:feature/dataset-manager-ux
