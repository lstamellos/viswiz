name: Temporary localization codemod

on:
  push:
    branches:
      - feature/javascript-localization

permissions:
  contents: write

jobs:
  codemod:
    if: contains(github.event.head_commit.message, '[run localization codemod]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Fix codemod source locators
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/localization_codemod.py')
          text = p.read_text()
          start = text.index('def add_wp_i18n_dependency(path, handle):')
          end = text.index('\ndef convert_tr(path, pre_remove_patterns=()):', start)
          replacement = r'''def script_call_range(lines, handle):
              source = ''.join(lines)
              constant_handle = bool(re.search(rf"const\s+SCRIPT_HANDLE\s*=\s*'{re.escape(handle)}'", source))
              for start, line in enumerate(lines):
                  if 'wp_enqueue_script(' not in line and 'wp_register_script(' not in line:
                      continue
                  depth = 0
                  call = []
                  for end in range(start, len(lines)):
                      call.append(lines[end])
                      depth += lines[end].count('(')
                      depth -= lines[end].count(')')
                      if depth <= 0 and ';' in lines[end]:
                          break
                  block = ''.join(call)
                  if f"'{handle}'" in block or (constant_handle and 'self::SCRIPT_HANDLE' in block):
                      return start, end
              raise RuntimeError(f'script call for {handle} missing')

          def add_wp_i18n_dependency(path, handle):
              lines = read(path).splitlines(keepends=True)
              start, end = script_call_range(lines, handle)
              block = ''.join(lines[start:end + 1])
              if "'wp-i18n'" in block:
                  return
              if '$dependencies' in block:
                  source = ''.join(lines)
                  pattern = re.compile(r"\$dependencies\s*=\s*array\(([^)]*)\);")
                  match = pattern.search(source)
                  if not match:
                      raise RuntimeError(f'dynamic dependency declaration for {handle} missing in {path}')
                  inner = match.group(1).strip()
                  if "'wp-i18n'" not in inner:
                      inner = inner.rstrip() + ", 'wp-i18n'"
                      source = source[:match.start(1)] + inner + source[match.end(1):]
                      write(path, source)
                  return
              pattern = re.compile(r'array\(([^()]*)\)')
              matches = list(pattern.finditer(block))
              if not matches:
                  raise RuntimeError(f'dependency array for {handle} missing in {path}')
              match = matches[-1]
              inner = match.group(1).strip()
              addition = " 'wp-i18n' " if not inner else inner.rstrip() + ", 'wp-i18n' "
              block = block[:match.start()] + 'array(' + addition + ')' + block[match.end():]
              lines[start:end + 1] = block.splitlines(keepends=True)
              write(path, ''.join(lines))

          def add_script_translations(path, handle):
              text = read(path)
              call = f"wp_set_script_translations( '{handle}', 'viswiz', VISWIZ_DIR . 'languages' );"
              if call in text:
                  return
              lines = text.splitlines(keepends=True)
              start, end = script_call_range(lines, handle)
              indent = re.match(r'\s*', lines[start]).group(0)
              lines.insert(end + 1, indent + call + '\n')
              write(path, ''.join(lines))
          '''
          text = text[:start] + replacement + text[end:]
          text = text.replace("'src/Admin/SpreadsheetEditor.php': ['viswiz-spreadsheet-editor'],", "'src/Admin/SpreadsheetEditor.php': ['viswiz-spreadsheet-editor-v2'],")
          text = text.replace("(\"['source', 'Data / source']\", \"['source', __('Data / source', 'viswiz')]\"),", "(\"section('data', 'Data / source')\", \"section('data', __('Data / source', 'viswiz'))\"),")
          text = text.replace("(\"['appearance', 'Appearance']\", \"['appearance', __('Appearance', 'viswiz')]\"),", "(\"section('appearance', 'Appearance')\", \"section('appearance', __('Appearance', 'viswiz'))\"),")
          text = text.replace("(\"['labels', 'Labels / content']\", \"['labels', __('Labels / content', 'viswiz')]\"),", "(\"section('labels', 'Labels / content')\", \"section('labels', __('Labels / content', 'viswiz'))\"),")
          text = text.replace("(\"['interaction', 'Interaction']\", \"['interaction', __('Interaction', 'viswiz')]\"),", "(\"section('interaction', 'Interaction')\", \"section('interaction', __('Interaction', 'viswiz'))\"),")
          text = text.replace("(\"['advanced', 'Advanced']\", \"['advanced', __('Advanced', 'viswiz')]\"),", "(\"section('advanced', 'Advanced')\", \"section('advanced', __('Advanced', 'viswiz'))\"),")
          text = '\n'.join(line for line in text.splitlines() if not ('field.parentNode' in line and 'Description' in line)) + '\n'
          fixed = []
          inserted_public = False
          for line in text.splitlines():
              if "heading.textContent = 'Public fields';" in line:
                  continue
              if "copy.textContent = 'Structured details shown in the public node information view." in line:
                  fixed.extend([
                      "    (\"copy.innerHTML = '<h3>Public fields</h3><p class=\\\"description\\\">Structured details shown in the public node information view. Order here is the public display order.</p>';\", \"copy.innerHTML = `<h3>${__('Public fields', 'viswiz')}</h3><p class=\\\"description\\\">${__('Structured details shown in the public node information view. Order here is the public display order.', 'viswiz')}</p>`;\"),",
                      "    (\"add.textContent = 'Add public field';\", \"add.textContent = __('Add public field', 'viswiz');\"),",
                      "    (\"remove.textContent = 'Remove';\", \"remove.textContent = __('Remove', 'viswiz');\"),",
                  ])
                  inserted_public = True
                  continue
              if "description.textContent = 'Reserved for uncommon" in line or "label.textContent = 'Additional metadata JSON'" in line or "label.textContent = 'Metadata JSON'" in line:
                  continue
              if "summary.textContent = 'Advanced metadata';" in line:
                  fixed.append(line)
                  fixed.extend([
                      "    (\"if (labelText) labelText.textContent = nodeMetadata ? 'Additional metadata JSON' : 'Metadata JSON';\", \"if (labelText) labelText.textContent = nodeMetadata ? __('Additional metadata JSON', 'viswiz') : __('Metadata JSON', 'viswiz');\"),",
                      "    (\"description.textContent = nodeMetadata\\n      ? 'Reserved for uncommon or integration-specific metadata. Public fields are managed above.'\\n      : 'Reserved for uncommon or integration-specific relation metadata.';\", \"description.textContent = nodeMetadata\\n      ? __('Reserved for uncommon or integration-specific metadata. Public fields are managed above.', 'viswiz')\\n      : __('Reserved for uncommon or integration-specific relation metadata.', 'viswiz');\"),",
                  ])
                  continue
              fixed.append(line)
          text = '\n'.join(fixed) + '\n'
          p.write_text(text)
          PY
      - name: Apply deterministic localization codemod
        run: python tools/localization_codemod.py
      - name: Commit codemod result
        shell: bash
        run: |
          git config user.name 'viswiz-localization-codemod'
          git config user.email 'actions@users.noreply.github.com'
          git add assets src tests docs languages tools/localization_codemod.py
          git diff --cached --check
          git commit -m 'Centralize JavaScript localization'
          git push origin HEAD:feature/javascript-localization
